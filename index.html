<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Letter</title>

<style>
:root {
    --primary: #ff4d6d;
    --bg-color: #ffccd5;
    --envelope-color: #ff8fa3;
    --envelope-dark: #ff758f;
}

*{
    padding:0;
    margin:0;
    box-sizing:border-box;
}

body {
    background-color: var(--bg-color);
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Hidden YouTube Player */
#player{
    display:none;
}

/* Envelope Layout */
.envelope-wrapper {
    position:relative;
}

#envelope {
    position:relative;
    width:280px;
    height:180px;
    background-color:var(--envelope-color);
    cursor:pointer;
    transition: transform 0.3s ease;
}

.flap {
    position:absolute;
    top:0;
    border-left:140px solid transparent;
    border-right:140px solid transparent;
    border-top:100px solid var(--primary);
    transform-origin:top;
    z-index:3;
    transition: transform 0.4s ease, z-index 0.2s;
}

.pocket {
    position:absolute;
    bottom:0;
    border-left:140px solid var(--envelope-color);
    border-right:140px solid var(--envelope-color);
    border-bottom:90px solid var(--envelope-dark);
    z-index:4;
}

.letter {
    position:absolute;
    bottom:5px;
    left:5%;
    width:90%;
    height:90%;
    /* background:#fffafa; */
    z-index:2;
    transition: transform 0.7s ease-in-out;
    padding:10px;
    overflow:hidden;
    background-image: url(Kawaii\ Hello\ Kitty\ 1920x1080\ Wallpaper\ 2024.jpg);
    background-size:cover;
    background-repeat: no-repeat;
    background-position: bottom;
}

.text{
    font-size:12px;
}

/* Lyrics Scroll Area */
.lyrics {
    margin-top:10px;
    height:80px;
    overflow:hidden;
    position:relative;
    border-radius: 10px;
}

.lyrics-inner {
    transition: transform 0.5s ease;
}

.line {
    height:30px;
    opacity:0.5;
    transition:0.3s;
}

.active {
    font-weight:bold;
    color:#ff4d6d;
    opacity:1;
    font-size:14px;
}

/* Open Animation */
.open .flap {
    transform: rotateX(180deg);
    z-index:1;
}

.open .letter {
    transform: translateY(-130px) scale(2);
    z-index:5;
    transition-delay:0.3s;
}

/* PETAL BACKGROUND */
/* 🌸 Floating Petals */
.petal{
    position:absolute;
    top:-20px;
    font-size:20px;
    animation:fall linear forwards;
    opacity:0.8;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(360deg);
        opacity:0;
    }
}


</style>
</head>

<body>
<div class="petal-container"></div>
<div id="player"></div>

<div class="envelope-wrapper">
    <div id="envelope" class="close">
        <div class="flap"></div>
        <div class="pocket"></div>

        <div class="letter">
            <div class="text">
                <strong>Happy Valentine Day Baby❤️</strong>

                <div class="lyrics">
                    <div class="lyrics-inner" id="lyrics"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>

/* 🌸 Floating Petals Generator */
function createPetal(){
    const petal=document.createElement("div");
    petal.className="petal";
    petal.innerHTML="🌸";
    petal.style.left=Math.random()*100+"vw";
    petal.style.animationDuration=5+Math.random()*5+"s";
    document.body.appendChild(petal);

    setTimeout(()=>petal.remove(),10000);
}
setInterval(createPetal,400);



/* -------------------------
   YOUTUBE API
-------------------------- */

let tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.body.appendChild(tag);

let player;
let lyricsData = [];
let currentIndex = -1;

function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
        height:'0',
        width:'0',
        videoId:'n5i3QRvPA9Y',
        playerVars:{ playsinline:1 }
    });
}

/* -------------------------
   ENVELOPE CONTROL
-------------------------- */

const envelope = document.getElementById('envelope');

envelope.addEventListener('click', () => {

    const isOpening = envelope.classList.contains('close');

    envelope.classList.toggle('open');
    envelope.classList.toggle('close');

    if(isOpening){
        player.playVideo();
    } else {
        player.stopVideo();
        currentIndex = -1;
        updateLyrics();
    }
});

/* -------------------------
   LRC PARSER
-------------------------- */

async function loadLRC(url){
    const res = await fetch(url);
    const text = await res.text();
    const lines = text.split("\n");

    lines.forEach(line=>{
        const match = line.match(/\[(\d+):(\d+\.\d+)\](.*)/);
        if(match){
            const min = parseInt(match[1]);
            const sec = parseFloat(match[2]);
            lyricsData.push({
                time:min*60+sec,
                text:match[3].trim()
            });
        }
    });

    renderLyrics();
    syncLyrics();
}

function renderLyrics(){
    const container = document.getElementById("lyrics");
    container.innerHTML = "";

    lyricsData.forEach((line,i)=>{
        const div = document.createElement("div");
        div.className="line";
        div.id="line-"+i;
        div.innerText=line.text;
        container.appendChild(div);
    });
}

/* -------------------------
   SYNC + SMOOTH SCROLL
-------------------------- */

function syncLyrics(){
    if(!player || typeof player.getCurrentTime!=='function'){
        requestAnimationFrame(syncLyrics);
        return;
    }

    const currentTime = player.getCurrentTime();

    let newIndex=-1;
    for(let i=lyricsData.length-1;i>=0;i--){
        if(currentTime>=lyricsData[i].time){
            newIndex=i;
            break;
        }
    }

    if(newIndex!==currentIndex){
        currentIndex=newIndex;
        updateLyrics();
    }

    requestAnimationFrame(syncLyrics);
}

function updateLyrics(){

    document.querySelectorAll(".line").forEach(l=>l.classList.remove("active"));

    if(currentIndex>=0){
        const activeLine=document.getElementById("line-"+currentIndex);
        if(activeLine){
            activeLine.classList.add("active");

            const offset = currentIndex * 30;
            document.getElementById("lyrics").style.transform =
                `translateY(-${offset}px)`;
        }
    }else{
        document.getElementById("lyrics").style.transform="translateY(0)";
    }
}

/* -------------------------
   INIT
-------------------------- */

loadLRC("lyrics.lrc");

</script>
</body>
</html>
